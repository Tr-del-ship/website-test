<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f6">
  <meta name="description" content="Manage customer support tickets, conversations, and response-time analytics in Queue.">
  <title>Staff inbox · Queue Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f8f6;
      --surface: #fff;
      --surface-soft: #f3f4f1;
      --ink: #202923;
      --muted: #848c85;
      --line: #ebede9;
      --green: #148361;
      --green-soft: #e9f5ef;
      --orange: #c16a40;
      --orange-soft: #fbf0e9;
      --blue: #497ca1;
      --blue-soft: #eaf2f7;
      --shadow: 0 8px 28px rgba(35, 45, 38, .055);
      font-family: 'DM Sans', sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--paper); color: var(--ink); font-size: 13px; }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    :focus-visible { outline: 3px solid rgba(20, 131, 97, .35); outline-offset: 2px; }
    .app { display: grid; grid-template-columns: 66px 242px minmax(270px, 335px) minmax(350px, 1fr) 248px; min-height: 100vh; max-width: 1920px; margin: 0 auto; }
    .rail { position: sticky; top: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100vh; padding: 17px 0; border-right: 1px solid var(--line); background: #f2f3f0; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; margin-bottom: 21px; border-radius: 12px; color: white; background: var(--green); }
    .rail-button { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 12px; color: #808a82; background: transparent; cursor: pointer; transition: .16s ease; }
    .rail-button:hover, .rail-button.active { color: var(--green); background: #e4eee7; }
    .rail-button.active::before { position: absolute; left: -13px; width: 3px; height: 21px; border-radius: 0 3px 3px 0; background: var(--green); content: ''; }
    .rail-spacer { flex: 1; }
    .workspace { display: flex; flex-direction: column; min-height: 100vh; padding: 20px 15px 16px; border-right: 1px solid var(--line); background: #fbfbfa; }
    .workspace-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; padding: 0 5px; }
    .workspace-identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .server-avatar { display: grid; flex: 0 0 auto; place-items: center; width: 35px; height: 35px; border-radius: 11px; color: #795b3f; background: #eee4d7; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 800; }
    .workspace-name { overflow: hidden; font-family: Manrope, sans-serif; font-size: 12px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-subtitle { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .section-label { margin: 22px 7px 9px; color: #939b94; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .nav-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 0 9px; border: 0; border-radius: 8px; color: #667068; background: transparent; text-align: left; cursor: pointer; }
    .nav-item:hover { background: var(--surface-soft); }
    .nav-item.selected { color: var(--green); background: #edf4ef; font-weight: 700; }
    .nav-label { display: flex; align-items: center; gap: 9px; }
    .nav-count { color: #939b94; font-size: 11px; }
    .nav-item.selected .nav-count { color: var(--green); }
    .channel-chip { color: #869089; font-size: 11px; }
    .team-list { display: grid; gap: 4px; padding: 0 6px; }
    .team-row { display: flex; align-items: center; gap: 9px; min-height: 31px; color: #667068; font-size: 12px; }
    .avatar { position: relative; display: grid; flex: 0 0 auto; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #46534a; background: #e9ebe3; font-family: Manrope, sans-serif; font-size: 10px; font-weight: 800; }
    .avatar.green { color: #27694f; background: #dcebe0; }
    .avatar.peach { color: #9b6243; background: #f3e5d9; }
    .avatar.blue { color: #456b85; background: #dfeaf0; }
    .avatar.pink { color: #895f72; background: #f2e4e9; }
    .online-dot { position: absolute; right: -1px; bottom: 0; width: 8px; height: 8px; border: 1.5px solid white; border-radius: 50%; background: #4db77a; }
    .my-profile { display: flex; align-items: center; gap: 9px; margin-top: auto; padding: 11px 5px 1px; border-top: 1px solid var(--line); }
    .my-profile-info { flex: 1; min-width: 0; }
    .profile-name { font-size: 11px; font-weight: 700; }
    .profile-status { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .inbox { display: flex; flex-direction: column; min-width: 0; min-height: 100vh; border-right: 1px solid var(--line); background: #fff; }
    .inbox-header { padding: 23px 17px 16px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--green); font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    .inbox-title { margin: 6px 0 16px; font-family: Manrope, sans-serif; font-size: 20px; font-weight: 750; letter-spacing: 0; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; top: 10px; left: 10px; color: #9aa19a; }
    .search-input { width: 100%; height: 35px; padding: 0 30px; border: 1px solid var(--line); border-radius: 8px; outline: none; color: var(--ink); background: #fbfbfa; font-size: 11px; }
    .search-input:focus, .reply-input:focus { border-color: #82ae98; box-shadow: 0 0 0 3px rgba(20, 131, 97, .08); }
    .shortcut { position: absolute; top: 9px; right: 9px; color: #a3aaa3; font-size: 10px; }
    .filters { display: flex; gap: 5px; margin-top: 13px; }
    .filter-button { padding: 5px 9px; border: 0; border-radius: 6px; color: #727b74; background: transparent; font-size: 10px; cursor: pointer; }
    .filter-button:hover { background: var(--surface-soft); }
    .filter-button.active { color: var(--green); background: var(--green-soft); font-weight: 700; }
    .ticket-list { flex: 1; overflow-y: auto; }
    .ticket-item { display: flex; gap: 10px; width: 100%; padding: 14px 15px; border: 0; border-bottom: 1px solid #f0f1ee; background: white; text-align: left; cursor: pointer; transition: background .14s ease; }
    .ticket-item:hover { background: #fafbf9; }
    .ticket-item.active { background: #f1f7f2; box-shadow: inset 3px 0 var(--green); }
    .ticket-item .avatar { width: 31px; height: 31px; }
    .ticket-copy { flex: 1; min-width: 0; }
    .ticket-topline { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
    .ticket-person { overflow: hidden; font-size: 11px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .ticket-time { flex: 0 0 auto; color: #9aa19a; font-size: 9px; }
    .ticket-subject { overflow: hidden; margin-top: 5px; color: #39443c; font-size: 11px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .ticket-preview { overflow: hidden; margin-top: 4px; color: #929a93; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .ticket-meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; width: fit-content; padding: 3px 6px; border-radius: 4px; color: #58705e; background: #edf2ec; font-size: 9px; font-weight: 600; }
    .tag.billing { color: #a06c45; background: #f8efe7; }
    .tag.bug { color: #577693; background: #edf2f6; }
    .tag.closed { color: #777e77; background: #f0f0ee; }
    .unread-dot { width: 6px; height: 6px; border-radius: 50%; background: #e18a5f; }
    .conversation { display: flex; flex-direction: column; min-width: 0; min-height: 100vh; background: #fff; }
    .conversation-header { display: flex; justify-content: space-between; align-items: center; min-height: 70px; padding: 12px 21px; border-bottom: 1px solid var(--line); }
    .conversation-title { margin: 0; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 750; }
    .conversation-subtitle { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .header-actions { display: flex; align-items: center; gap: 7px; }
    .details-toggle { display: none; align-items: center; min-height: 33px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; color: #68746b; background: white; font-size: 10px; font-weight: 600; cursor: pointer; }
    .icon-button { display: grid; place-items: center; width: 33px; height: 33px; border: 1px solid var(--line); border-radius: 8px; color: #758077; background: #fff; cursor: pointer; transition: .14s ease; }
    .icon-button:hover { color: var(--green); border-color: #d1dfd5; background: #f5f8f5; }
    .resolve-button { display: flex; align-items: center; gap: 6px; height: 33px; padding: 0 11px; border: 0; border-radius: 7px; color: white; background: var(--green); font-size: 10px; font-weight: 700; cursor: pointer; }
    .resolve-button:hover { background: #116f53; }
    .resolve-button.is-closed { color: #637267; background: #e9efe9; }
    .message-stream { display: flex; flex: 1; flex-direction: column; gap: 19px; overflow: auto; padding: 21px 24px 28px; }
    .date-divider { display: flex; align-items: center; gap: 10px; color: #a0a7a0; font-size: 9px; }
    .date-divider::before, .date-divider::after { flex: 1; height: 1px; background: var(--line); content: ''; }
    .message { display: flex; align-items: flex-start; gap: 9px; max-width: 93%; animation: rise .2s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .message-body { min-width: 0; }
    .message-heading { display: flex; align-items: baseline; gap: 7px; margin: 1px 0 5px; }
    .message-name { font-size: 10px; font-weight: 700; }
    .message-time { color: #a0a7a0; font-size: 9px; }
    .message-text { padding: 10px 12px; border: 1px solid #efefec; border-radius: 2px 10px 10px; color: #4c574f; background: #f7f8f5; font-size: 11px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.staff { align-self: flex-end; flex-direction: row-reverse; }
    .message.staff .message-body { display: flex; flex-direction: column; align-items: flex-end; }
    .message.staff .message-text { border-color: #e1eee5; border-radius: 10px 2px 10px 10px; background: #edf5ef; }
    .message.staff .message-heading { flex-direction: row-reverse; }
    .internal-note { align-self: center; width: min(100%, 390px); padding: 10px 12px; border: 1px dashed #dfc7aa; border-radius: 7px; color: #876944; background: #fcf7ef; font-size: 10px; line-height: 1.6; }
    .internal-note strong { display: block; margin-bottom: 3px; font-size: 9px; text-transform: uppercase; }
    .reply-area { padding: 12px 20px 17px; border-top: 1px solid var(--line); }
    .reply-mode { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
    .mode-button { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: 0; color: #8a928b; background: transparent; font-size: 10px; cursor: pointer; }
    .mode-button.active { color: var(--green); font-weight: 700; }
    .reply-box { position: relative; }
    .reply-input { display: block; width: 100%; min-height: 80px; resize: vertical; padding: 11px 12px 38px; border: 1px solid var(--line); border-radius: 8px; outline: none; color: var(--ink); background: #fdfdfc; font-size: 11px; line-height: 1.6; }
    .reply-input::placeholder { color: #a4aaa4; }
    .reply-tools { position: absolute; right: 8px; bottom: 8px; left: 9px; display: flex; justify-content: space-between; align-items: center; }
    .reply-hint { color: #a0a7a0; font-size: 9px; }
    .send-button { display: flex; align-items: center; gap: 5px; padding: 6px 10px; border: 0; border-radius: 6px; color: white; background: var(--green); font-size: 10px; font-weight: 700; cursor: pointer; }
    .send-button:hover { background: #116f53; }
    .details { min-height: 100vh; border-left: 1px solid var(--line); background: #fbfbfa; }
    .details-header { display: flex; align-items: center; justify-content: space-between; min-height: 70px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    .details-heading { font-family: Manrope, sans-serif; font-size: 12px; font-weight: 750; }
    .details-section { padding: 16px; border-bottom: 1px solid var(--line); }
    .customer-card { display: flex; align-items: center; gap: 10px; }
    .customer-card .avatar { width: 37px; height: 37px; }
    .customer-name { font-size: 12px; font-weight: 700; }
    .customer-handle { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .customer-actions { display: flex; gap: 7px; margin-top: 14px; }
    .small-action { display: flex; justify-content: center; align-items: center; gap: 5px; flex: 1; min-height: 30px; border: 1px solid var(--line); border-radius: 6px; color: #6e786f; background: white; font-size: 9px; cursor: pointer; }
    a.small-action { text-decoration: none; }
    .small-action:hover { border-color: #cddbd0; color: var(--green); }
    .detail-label { display: block; margin-bottom: 8px; color: #879088; font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .detail-select { width: 100%; height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; outline: none; color: #475149; background: white; font-size: 10px; }
    .label-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .label-add { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border: 1px dashed #d9ddd8; border-radius: 4px; color: #858d86; background: transparent; font-size: 9px; cursor: pointer; }
    .metadata-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; color: #909890; font-size: 9px; }
    .metadata-row strong { color: #505b52; font-weight: 600; text-align: right; }
    .activity-heading { margin-bottom: 13px; color: #879088; font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .activity-item { position: relative; display: flex; gap: 8px; padding-bottom: 13px; color: #748076; font-size: 9px; line-height: 1.5; }
    .activity-item:not(:last-child)::before { position: absolute; top: 15px; bottom: 0; left: 5px; width: 1px; background: #e6e9e5; content: ''; }
    .activity-dot { z-index: 1; flex: 0 0 auto; width: 11px; height: 11px; margin-top: 2px; border: 2px solid white; border-radius: 50%; background: #91b6a0; box-shadow: 0 0 0 1px #dce7de; }
    .activity-time { display: block; margin-top: 2px; color: #a2a8a2; font-size: 8px; }
    .empty-state { display: grid; min-height: 240px; place-items: center; padding: 30px; color: #9ba39c; text-align: center; }
    .empty-state svg { margin-bottom: 9px; color: #9cae9f; }
    .empty-state strong { display: block; margin-bottom: 5px; color: #505b52; font-size: 12px; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 10; padding: 11px 16px; border: 1px solid #deebe1; border-radius: 8px; color: #275b40; background: white; box-shadow: var(--shadow); font-size: 11px; animation: rise .18s ease both; }
    .page-view { display: none; grid-column: 3 / -1; min-width: 0; min-height: 100vh; overflow-y: auto; padding: clamp(22px, 4vw, 48px); background: var(--paper); }
    .app:not([data-page="tickets"]) .inbox, .app:not([data-page="tickets"]) .conversation, .app:not([data-page="tickets"]) .details { display: none; }
    .app:not([data-page="tickets"]) .page-view { display: block; }
    .page-heading { margin-bottom: 24px; }
    .page-heading.analytics-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .page-heading h1 { margin: 7px 0 6px; font-family: Manrope, sans-serif; font-size: clamp(23px, 3vw, 31px); letter-spacing: -.03em; }
    .page-heading p { max-width: 650px; margin: 0; color: #7e887f; font-size: 12px; line-height: 1.7; }
    .analytics-range { display: grid; gap: 6px; flex: 0 0 auto; color: #7e887f; font-size: 10px; font-weight: 700; }
    .analytics-range select { min-width: 142px; height: 36px; padding: 0 10px; border: 1px solid #dfe5df; border-radius: 7px; color: #475149; background: #fff; font-size: 11px; }
    .page-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .page-card { min-width: 0; padding: 19px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: var(--shadow); }
    .metric-label { color: #828c83; font-size: 10px; font-weight: 600; }
    .metric-value { margin-top: 8px; font-family: Manrope, sans-serif; font-size: 29px; font-weight: 750; letter-spacing: -.04em; }
    .metric-caption { margin-top: 4px; color: #929a93; font-size: 10px; }
    .page-card h2 { margin: 0 0 15px; font-family: Manrope, sans-serif; font-size: 13px; }
    .page-card.wide { grid-column: span 2; }
    .page-card.full { grid-column: 1 / -1; }
    .chart-row { display: grid; grid-template-columns: 82px minmax(30px, 1fr) 25px; align-items: center; gap: 10px; margin: 13px 0; color: #677168; font-size: 10px; }
    .chart-track { height: 8px; overflow: hidden; border-radius: 99px; background: #eef0ec; }
    .chart-bar { height: 100%; min-width: 2px; border-radius: inherit; background: #68a787; }
    .chart-value { color: #858e86; text-align: right; }
    .response-card { padding: 22px; }
    .response-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 12px; }
    .response-card-header h2 { margin: 0 0 5px; font-size: 15px; }
    .response-card-header p { margin: 0; color: #89938a; font-size: 10px; line-height: 1.6; }
    .response-count { flex: 0 0 auto; padding: 6px 9px; border-radius: 20px; color: #52715b; background: #edf4ef; font-size: 10px; font-weight: 700; }
    .response-chart { display: block; width: 100%; height: auto; overflow: visible; }
    .response-chart-grid { stroke: #edf0ec; stroke-width: 1; }
    .response-chart-axis { fill: #88928a; font: 10px 'DM Sans', sans-serif; }
    .response-chart-line { fill: none; stroke: #25815e; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
    .response-chart-point { fill: #fff; stroke: #25815e; stroke-width: 2.5; }
    .response-chart-empty { display: grid; min-height: 200px; place-items: center; padding: 24px; border: 1px dashed #dce5dd; border-radius: 9px; color: #77837a; background: #fafbf9; font-size: 11px; text-align: center; }
    .response-records { margin-top: 13px; border-top: 1px solid #eff1ee; }
    .response-records table { width: 100%; border-collapse: collapse; text-align: left; }
    .response-records th { padding: 11px 8px 8px; color: #939b94; font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .response-records td { padding: 9px 8px; border-top: 1px solid #f2f3f1; color: #566158; font-size: 10px; }
    .response-records td:last-child { color: #315d43; font-weight: 700; text-align: right; }
    .response-records .response-id { color: #929a93; }
    .response-no-records { padding: 13px 8px; color: #89938a; font-size: 10px; }
    .community-list { display: grid; gap: 9px; }
    .community-item { display: flex; width: 100%; align-items: flex-start; gap: 11px; padding: 13px; border: 1px solid var(--line); border-radius: 9px; background: white; text-align: left; cursor: pointer; }
    .community-item:hover { border-color: #c8dbce; background: #fbfdfb; }
    .community-item-copy { flex: 1; min-width: 0; }
    .community-item-title { display: flex; justify-content: space-between; gap: 10px; color: #344038; font-size: 11px; font-weight: 700; }
    .community-item-preview { display: block; margin-top: 5px; overflow: hidden; color: #818b82; font-size: 10px; font-weight: 400; line-height: 1.6; text-overflow: ellipsis; }
    .community-item-meta { display: flex; gap: 6px; margin-top: 8px; }
    .settings-form { max-width: 650px; }
    .settings-group { margin-bottom: 13px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: white; }
    .settings-group h2 { margin: 0 0 5px; font-family: Manrope, sans-serif; font-size: 13px; }
    .settings-group p { margin: 0 0 14px; color: #8b948c; font-size: 10px; line-height: 1.6; }
    .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 40px; color: #49544b; font-size: 11px; }
    .settings-row + .settings-row { margin-top: 8px; padding-top: 10px; border-top: 1px solid #f0f1ee; }
    .settings-control { min-width: 135px; height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; color: #475149; background: white; font-size: 10px; }
    .settings-checkbox { width: 16px; height: 16px; accent-color: var(--green); }
    .primary-button { min-height: 36px; padding: 0 13px; border: 0; border-radius: 7px; color: white; background: var(--green); font-size: 10px; font-weight: 700; cursor: pointer; }
    .primary-button:hover { background: #116f53; }
    .app.compact-tickets .ticket-item { padding-top: 9px; padding-bottom: 9px; }
    .app.compact-tickets .ticket-meta { margin-top: 5px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }
    @media (max-width: 1220px) {
      .app { grid-template-columns: 58px 202px minmax(250px, 305px) minmax(330px, 1fr); }
      .details-toggle { display: inline-flex; }
      .details { position: fixed; top: 0; right: 0; bottom: 0; z-index: 6; display: none; width: min(300px, 88vw); min-height: 100dvh; overflow-y: auto; border-left: 1px solid var(--line); box-shadow: -12px 0 36px rgba(35, 45, 38, .12); }

  <script>
    const seedTickets = [
      { id: 'TK-2841', name: 'Maya Chen', handle: '@mayacreates', initials: 'MC', avatar: 'peach', subject: 'Order arrived damaged', preview: 'One of the ceramic mugs has a crack right through the side...', category: 'Billing', status: 'open', assignee: 'Avery Morgan', channel: 'billing-help', unread: true, time: '2m', created: 'Today, 10:42 AM', messages: [{ who: 'Maya Chen', initials: 'MC', avatar: 'peach', time: '10:42 AM', text: 'Hi there! My order (#OF-90312) just arrived, but unfortunately one of the ceramic mugs has a crack right through the side. The box looked fine, so I think it happened before shipping. What can we do about a replacement?' }, { who: 'Avery Morgan', initials: 'AM', avatar: 'green', time: '10:48 AM', staff: true, text: 'Oh no, I’m sorry that happened, Maya. We can absolutely send a replacement. Could you share a photo of the damage so I can get that arranged for you?' }, { who: 'Maya Chen', initials: 'MC', avatar: 'peach', time: '10:51 AM', text: 'Just attached a photo! Thank you for making this easy.' }], activity: ['Ticket created by Maya Chen', 'Assigned to Avery Morgan'] },
      { id: 'TK-2840', name: 'Elliot Brooks', handle: '@elliotbuilds', initials: 'EB', avatar: 'blue', subject: 'Can’t access my account', preview: 'Reset link keeps taking me back to the sign-in page...', category: 'Technical', status: 'open', assignee: 'Jordan Kim', channel: 'technical', unread: true, time: '18m', created: 'Today, 10:26 AM', messages: [{ who: 'Elliot Brooks', initials: 'EB', avatar: 'blue', time: '10:26 AM', text: 'I’ve been trying to reset my password all morning. Every time I click the reset link, it takes me right back to the sign-in page. Tried Chrome and Safari with the same result.' }, { who: 'Jordan Kim', initials: 'JK', avatar: 'peach', time: '10:33 AM', staff: true, text: 'Thanks for flagging this, Elliot. I’m looking into it now. In the meantime, could you let me know roughly when you requested the reset email?' }], activity: ['Ticket created by Elliot Brooks', 'Assigned to Jordan Kim'] },
      { id: 'TK-2839', name: 'Priya Shah', handle: '@priyamakes', initials: 'PS', avatar: 'pink', subject: 'Question about the studio plan', preview: 'Does the monthly plan include the shared pattern library?', category: 'General', status: 'open', assignee: 'Avery Morgan', channel: 'general', unread: false, time: '1h', created: 'Today, 9:14 AM', messages: [{ who: 'Priya Shah', initials: 'PS', avatar: 'pink', time: '9:14 AM', text: 'Hey! I’m thinking of upgrading to the Studio plan and wondered if it includes access to the shared pattern library, or if that’s an add-on. Thanks!' }, { who: 'Avery Morgan', initials: 'AM', avatar: 'green', time: '9:22 AM', staff: true, text: 'Hi Priya! Great question. The shared pattern library is included with every Studio plan, monthly or annual. You’ll also get the team workspace and unlimited project boards.' }], activity: ['Ticket created by Priya Shah', 'Assigned to Avery Morgan'] },
      { id: 'TK-2838', name: 'Noah Williams', handle: '@noahdraws', initials: 'NW', avatar: 'green', subject: 'Feature request: color palettes', preview: 'Would love a way to save and share custom color sets...', category: 'General', status: 'open', assignee: 'Riley Lee', channel: 'general', unread: false, time: '2h', created: 'Today, 8:03 AM', messages: [{ who: 'Noah Williams', initials: 'NW', avatar: 'green', time: '8:03 AM', text: 'I’d love a way to save custom color palettes and share them with my team. Right now we keep passing hex codes around in chat. It’d make collaboration so much easier!' }, { who: 'Riley Lee', initials: 'RL', avatar: 'blue', time: '8:20 AM', staff: true, text: 'I hear you. We’ve heard this from a few teams, and I’ve added your vote to the feature request. I’ll make sure our product team sees the details.' }], activity: ['Ticket created by Noah Williams', 'Added to product feedback'] },
      { id: 'TK-2837', name: 'Sofia Martinez', handle: '@sofiam', initials: 'SM', avatar: 'peach', subject: 'Double charged for September', preview: 'I see two charges on my statement for the same invoice...', category: 'Billing', status: 'open', assignee: 'Sam Chen', channel: 'billing-help', unread: true, time: '3h', created: 'Today, 7:31 AM', messages: [{ who: 'Sofia Martinez', initials: 'SM', avatar: 'peach', time: '7:31 AM', text: 'Hi, I just checked my bank statement and I’m seeing two identical charges for my September invoice. Could you help me figure out what happened?' }], activity: ['Ticket created by Sofia Martinez'] },
      { id: 'TK-2836', name: 'Luca Moretti', handle: '@lucam', initials: 'LM', avatar: 'blue', subject: 'Thanks for the quick fix!', preview: 'Everything is working perfectly now. Really appreciate it.', category: 'Technical', status: 'closed', assignee: 'Avery Morgan', channel: 'technical', unread: false, time: '5h', created: 'Today, 5:12 AM', messages: [{ who: 'Luca Moretti', initials: 'LM', avatar: 'blue', time: '5:12 AM', text: 'Everything is working perfectly now. Really appreciate you fixing the export issue so quickly!' }, { who: 'Avery Morgan', initials: 'AM', avatar: 'green', time: '5:19 AM', staff: true, text: 'So glad that did the trick, Luca! Thanks for your patience, and happy creating.' }], activity: ['Ticket created by Luca Moretti', 'Resolved by Avery Morgan'] },
      { id: 'TK-2835', name: 'Amara Okafor', handle: '@amaraok', initials: 'AO', avatar: 'pink', subject: 'Update my billing email', preview: 'I need to switch invoices over to our new finance address.', category: 'Billing', status: 'closed', assignee: 'Jordan Kim', channel: 'billing-help', unread: false, time: 'Yesterday', created: 'Yesterday, 4:35 PM', messages: [{ who: 'Amara Okafor', initials: 'AO', avatar: 'pink', time: '4:35 PM', text: 'Our finance team has a new email address. Could you update invoices to go to finance@studio.co going forward?' }, { who: 'Jordan Kim', initials: 'JK', avatar: 'peach', time: '4:39 PM', staff: true, text: 'All set! I’ve updated your billing contact email. Your next invoice will go to the new address.' }], activity: ['Ticket created by Amara Okafor', 'Resolved by Jordan Kim'] }
    ];
    let tickets = [];
    let selectedId = tickets[0]?.id || null;
    let activeFilter = 'all';
    let selectedChannel = null;
    let replyAsNote = false;
    let toastTimer;
    let refreshTimer;
    let currentPage = 'tickets';
    let analyticsRangeDays = 7;
    const $ = (selector) => document.querySelector(selector);
    const app = $('#app');
    const pageView = $('#page-view');
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const currentTicket = () => tickets.find((ticket) => ticket.id === selectedId);
    const settings = { refreshSeconds: 15, compactTickets: false };
    try {
      const savedSettings = JSON.parse(localStorage.getItem('queue-support-settings') || '{}');
      if ([15, 30, 60].includes(savedSettings.refreshSeconds)) settings.refreshSeconds = savedSettings.refreshSeconds;
      if (typeof savedSettings.compactTickets === 'boolean') settings.compactTickets = savedSettings.compactTickets;
    } catch (error) {
      console.error('Could not load saved support inbox settings:', error);
    }
    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...options.headers }
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `Request failed (${response.status}).`);
      return result;
    }
    async function updateTicket(ticket, changes) {
      const updated = await api(`/api/admin/tickets/${encodeURIComponent(ticket.id)}`, {
        method: 'PATCH',
        body: JSON.stringify(changes)
      });
      const index = tickets.findIndex((item) => item.id === updated.id);
      if (index !== -1) tickets[index] = updated;
      render();
      return updated;
    }
    function reportError(error) {
      console.error('Could not update the support inbox:', error);
      showToast(error.message || 'The request could not be completed.');
    }
    const initialsAvatar = (initials, color) => `<span class="avatar ${esc(color)}">${esc(initials)}</span>`;
    const categoryClass = (category) => category === 'Billing' ? 'billing' : category === 'Technical' ? 'bug' : '';
    const relativeTime = (ticket) => {
      const age = Math.max(0, Date.now() - Date.parse(ticket.createdAt));
      if (!Number.isFinite(age) || age < 60_000) return 'now';
      if (age < 3_600_000) return `${Math.floor(age / 60_000)}m`;
      if (age < 86_400_000) return `${Math.floor(age / 3_600_000)}h`;
      return `${Math.floor(age / 86_400_000)}d`;
    };
    function showToast(message) {
      const region = $('#toast-region');
      region.innerHTML = `<div class="toast" role="status">${esc(message)}</div>`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { region.innerHTML = ''; }, 2600);
    }
    function formatDuration(milliseconds, compact = false) {
      const seconds = Math.round(milliseconds / 1000);
      if (seconds < 60) return `${Math.max(0, seconds)}s`;
      const minutes = Math.round(milliseconds / 60_000);
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      const remainingMinutes = minutes % 60;
      if (hours < 24) return compact || !remainingMinutes ? `${hours}h` : `${hours}h ${remainingMinutes}m`;
      const days = minutes / (24 * 60);
      return `${days.toFixed(days < 10 ? 1 : 0)}d`;
    }
    function formatResponseDate(date, includeTime = false) {
      return new Intl.DateTimeFormat('en', includeTime
        ? { dateStyle: 'medium', timeStyle: 'short' }
        : { month: 'short', day: 'numeric' }
      ).format(date);
    }
    function firstStaffResponse(ticket) {
      const createdAt = Date.parse(ticket.createdAt);
      if (!Number.isFinite(createdAt)) return null;
      const responseTimes = (ticket.messages || [])
        .filter((message) => message.staff && !message.note)
        .map((message) => Date.parse(message.createdAt))
        .filter((timestamp) => Number.isFinite(timestamp));
      const legacyResponseTimes = (ticket.activity || [])
        .filter((entry) => entry && typeof entry === 'object' && /^Reply saved by /.test(entry.text || ''))
        .map((entry) => Date.parse(entry.createdAt))
        .filter((timestamp) => Number.isFinite(timestamp));
      const respondedAt = responseTimes.concat(legacyResponseTimes)
        .reduce((earliest, timestamp) => Math.min(earliest, timestamp), Infinity);
      if (!Number.isFinite(respondedAt) || respondedAt < createdAt) return null;
      return { ticket, respondedAt, duration: respondedAt - createdAt };
    }
    function renderResponseChart(responses, rangeDays) {
      const now = Date.now();
      const rangeStart = now - rangeDays * 24 * 60 * 60 * 1000;
      const visibleResponses = responses
        .filter(({ respondedAt }) => respondedAt >= rangeStart && respondedAt <= now)
        .sort((left, right) => right.respondedAt - left.respondedAt);
      const bucketCount = rangeDays === 7 ? 7 : rangeDays === 30 ? 10 : rangeDays === 90 ? 13 : 12;
      const bucketDuration = (now - rangeStart) / bucketCount;
      const buckets = Array.from({ length: bucketCount }, (_, index) => ({
        start: rangeStart + index * bucketDuration,
        end: Math.min(now, rangeStart + (index + 1) * bucketDuration),
        responses: []
      }));
      for (const response of visibleResponses) {
        const index = Math.min(bucketCount - 1, Math.floor((response.respondedAt - rangeStart) / bucketDuration));
        buckets[index].responses.push(response);
      }
      const averages = buckets.map(({ responses: items }) => items.length
        ? items.reduce((total, item) => total + item.duration, 0) / items.length
        : null);
      const chart = visibleResponses.length ? (() => {
        const width = 760;
        const height = 250;
        const left = 62;
        const right = 18;
        const top = 15;
        const bottom = 35;
        const plotWidth = width - left - right;
        const plotHeight = height - top - bottom;
        const maxDuration = Math.max(60_000, ...averages.filter((value) => value !== null)) * 1.15;
        const xFor = (index) => left + (bucketCount === 1 ? plotWidth / 2 : index / (bucketCount - 1) * plotWidth);
        const yFor = (value) => top + plotHeight - value / maxDuration * plotHeight;
        const grid = Array.from({ length: 5 }, (_, index) => {
          const value = maxDuration * index / 4;
          const y = yFor(value);
          return `<line class="response-chart-grid" x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line><text class="response-chart-axis" x="${left - 9}" y="${y + 3}" text-anchor="end">${esc(formatDuration(value, true))}</text>`;
        }).join('');
        const paths = [];
        let currentPath = [];
        averages.forEach((value, index) => {
          if (value === null) {
            if (currentPath.length) paths.push(currentPath);
            currentPath = [];
          } else currentPath.push(`${xFor(index)},${yFor(value)}`);
        });
        if (currentPath.length) paths.push(currentPath);
        const lines = paths.filter((points) => points.length > 1)
          .map((points) => `<polyline class="response-chart-line" points="${points.join(' ')}"></polyline>`).join('');
        const points = averages.map((value, index) => {
          if (value === null) return '';
          const bucket = buckets[index];
          const dateLabel = bucketDuration < 24 * 60 * 60 * 1000
            ? formatResponseDate(new Date(bucket.start))
            : `${formatResponseDate(new Date(bucket.start))} – ${formatResponseDate(new Date(bucket.end))}`;
          const label = `${dateLabel}: ${formatDuration(value)} average first response, ${bucket.responses.length} ${bucket.responses.length === 1 ? 'ticket' : 'tickets'}`;
          return `<circle class="response-chart-point" cx="${xFor(index)}" cy="${yFor(value)}" r="5"><title>${esc(label)}</title></circle>`;
        }).join('');
        const axisFormatter = new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric' });
        const tickIndexes = [...new Set([0, Math.round((bucketCount - 1) / 3), Math.round((bucketCount - 1) * 2 / 3), bucketCount - 1])];
        const axis = tickIndexes.map((index) => `<text class="response-chart-axis" x="${xFor(index)}" y="${height - 8}" text-anchor="${index === 0 ? 'start' : index === bucketCount - 1 ? 'end' : 'middle'}">${esc(axisFormatter.format(new Date(buckets[index].start)))}</text>`).join('');
        return `<svg class="response-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Average time to first staff reply over the past ${rangeDays} days. Higher points mean slower responses."><title>First response time over the past ${rangeDays} days</title><desc>Each point shows the average first response time for tickets replied to during that date range. Higher values mean slower responses.</desc>${grid}${lines}${points}${axis}</svg>`;
      })() : '<div class="response-chart-empty">No staff first responses in this period yet. Try a longer date range or check back after the team replies.</div>';
      const recentRows = visibleResponses.slice(0, 5).map(({ ticket, respondedAt, duration }) => `<tr><td>${esc(formatResponseDate(new Date(respondedAt), true))}</td><td class="response-id">${esc(ticket.id)}</td><td>${esc(formatDuration(duration))}</td></tr>`).join('');
      const records = visibleResponses.length
        ? `<div class="response-records"><table><thead><tr><th scope="col">Response date</th><th scope="col">Ticket</th><th scope="col">Time to first reply</th></tr></thead><tbody>${recentRows}</tbody></table></div>`
        : '';
      return `<article class="page-card full response-card"><div class="response-card-header"><div><h2>Time to first staff response</h2><p>Measured from ticket creation to the first public staff reply. Higher means slower; lower means faster.</p></div><span class="response-count">${visibleResponses.length} ${visibleResponses.length === 1 ? 'first reply' : 'first replies'}</span></div>${chart}${records}</article>`;
    }
    function renderAnalytics() {

          ${renderResponseChart(responses, analyticsRangeDays)}

    async function loadTickets() {
      const previousId = selectedId;
      const nextTickets = await api('/api/admin/tickets');
      if (JSON.stringify(nextTickets) === JSON.stringify(tickets)) return;
      tickets = nextTickets;
      selectedId = tickets.some((ticket) => ticket.id === previousId) ? previousId : tickets[0]?.id || null;
      render();
    }
    render();
    loadTickets().catch(reportError);
    app.classList.toggle('compact-tickets', settings.compactTickets);
    startTicketRefresh();
  </script>
</body>
</html>
